<ion-header [translucent]="true">
  <ion-toolbar class="toolbar">
    <ion-buttons slot="start">
      <ion-button class="back-button" (click)="navigateBack()">
        <ion-icon name="arrow-back"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>
      {{ 'settings.cache.title' | translate }}
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list>
    <ion-item>
      <ion-button id="open-category-toast" class="clear-button" (click)="clearCategoryCache()">{{ 'settings.cache.clearCategories' | translate }}</ion-button>
    </ion-item>
  </ion-list>
  <ion-toast position="top" trigger="open-category-toast" [message]="'settings.cache.categoriesReset' | translate" [duration]="1500"></ion-toast>
</ion-content>
