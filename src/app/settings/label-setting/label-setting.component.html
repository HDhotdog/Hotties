<ion-header [translucent]="true">
  <ion-toolbar class="toolbar">
    <ion-buttons slot="start">
      <ion-button class="back-button" (click)="navigateBack()">
        <ion-icon name="arrow-back"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>
      Manage labels
    </ion-title>
    <ion-buttons slot="end">
      <ion-button class="add-button" (click)="openLabelManager()">
        <ion-icon name="add"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list>
    <ion-reorder-group [disabled]="false" (ionItemReorder)="handleReorderOfLabelGroups($any($event))">
      <ion-item class="groupReorder" *ngFor="let labelGroup of labelService.labelGroups">
        <div class="group-item">
          <ion-reorder slot="start"></ion-reorder>
          <ion-label>{{ labelGroup.name }}</ion-label>
        </div>
        <ion-reorder-group  [disabled]="false" (ionItemReorder)="handleReorderOfLabels($any($event), labelGroup)">
          <ion-item *ngFor="let label of labelGroup.labels">
            <div class="label-item">
              <ion-reorder slot="start"></ion-reorder>
              <ion-label>{{ label.name }}</ion-label>
            </div>
          </ion-item>
        </ion-reorder-group>
      </ion-item>
    </ion-reorder-group>
  </ion-list>
</ion-content>
