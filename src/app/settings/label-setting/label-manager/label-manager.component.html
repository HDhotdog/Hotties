<ion-header>
  <ion-toolbar>
    <ion-title>Manage Labels</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="dismiss()">
        <ion-icon name="close"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list>
    <!-- Add Label Group -->
    <ion-item>
      <ion-input [(ngModel)]="newGroupName" placeholder="New Label Group"></ion-input>
      <ion-button slot="end" (click)="addLabelGroup()" [disabled]="!newGroupName.trim()">
        <ion-icon name="add"></ion-icon>
      </ion-button>
    </ion-item>

    <!-- Label Groups -->
    <ion-item-group *ngFor="let group of labelService.labelGroups">
      <ion-item-divider>
        <ion-label>{{ group.name }}</ion-label>
        <ion-button slot="end" (click)="removeLabelGroup(group)" color="danger">
          <ion-icon name="trash"></ion-icon>
        </ion-button>
      </ion-item-divider>

      <!-- Add Label to Group -->
      <ion-item *ngIf="selectedGroup === group">
        <ion-input [(ngModel)]="newLabelName" placeholder="New Label"></ion-input>
        <ion-button slot="end" (click)="addLabel()" [disabled]="!newLabelName.trim()">
          <ion-icon name="add"></ion-icon>
        </ion-button>
      </ion-item>

      <!-- Labels in Group -->
      <ion-item *ngFor="let label of group.labels">
        <ion-label>{{ label.name }}</ion-label>
        <ion-button slot="end" (click)="removeLabel(group, label)" color="danger">
          <ion-icon name="trash"></ion-icon>
        </ion-button>
      </ion-item>

      <!-- Add Label Button -->
      <ion-item *ngIf="selectedGroup !== group">
        <ion-button expand="block" (click)="selectedGroup = group">
          Add Label to {{ group.name }}
        </ion-button>
      </ion-item>
    </ion-item-group>
  </ion-list>
</ion-content>
