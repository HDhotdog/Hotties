<ion-header [translucent]="true">
  <ion-toolbar class="toolbar">
    <ion-buttons slot="start">
      <ion-button (click)="navigateBack()">
        <ion-icon name="arrow-back"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>
      {{ 'settings.category.editTitle' | translate }}
    </ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="saveCategory()" [ngClass]="{'save-button-active': this.inputChanged()}"
        [disabled]="!this.inputChanged()">
        <ion-icon name="save"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="container">
    <ion-grid>
      <ion-row id="data-row">
        <ion-input [(ngModel)]="name" [placeholder]="'settings.category.namePlaceholder' | translate"></ion-input>
      </ion-row>
      @if (this.editingCategory()) {
        <ion-row id="data-row">
          <ion-label>{{ 'settings.category.manageSuggestions' | translate }}</ion-label>
          <ion-icon name="pencil"></ion-icon>
        </ion-row>
      }
      <ion-row id="data-row">
        <ion-label>{{ 'settings.category.saveSuggestions' | translate }}</ion-label>
        <ion-toggle [(ngModel)]="saveSuggestions" [checked]="previousInputs.saveSuggestions"></ion-toggle>
      </ion-row>
    </ion-grid>
  </div>
</ion-content>
