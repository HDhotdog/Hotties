<ion-header [translucent]="true">
  <ion-toolbar class="toolbar">
    <ion-buttons slot="start">
      <ion-button (click)="navigateBack()" [attr.aria-label]="i18n.t('ui.previous')">
        <ion-icon name="arrow-back"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>
      {{ i18n.t('ui.editShoppingList') }}
    </ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="saveCategory()" [ngClass]="{'save-button-active': this.inputChanged()}"
                  [disabled]="!this.inputChanged()" [attr.aria-label]="i18n.t('ui.save')">
        <ion-icon name="save"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="container">
    <ion-grid>
      <ion-row id="data-row">
        <ion-input [(ngModel)]="name" [placeholder]="i18n.t('ui.enterShoppingListName')" [attr.aria-label]="i18n.t('ui.enterShoppingListName')"></ion-input>
      </ion-row>
      <ion-row id="data-row">
        <ion-label>{{ i18n.t('ui.saveSuggestions') }}</ion-label>
        <ion-toggle [(ngModel)]="saveSuggestions" [checked]="previousInputs.saveSuggestions"></ion-toggle>
      </ion-row>
    </ion-grid>
  </div>
</ion-content>
