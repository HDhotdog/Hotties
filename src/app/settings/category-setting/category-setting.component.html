<ion-header [translucent]="true">
  <ion-toolbar class="toolbar">
    <ion-buttons slot="start">
      <ion-button class="back-button" (click)="navigateBack()">
        <ion-icon name="arrow-back"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>
      {{ 'settings.category.title' | translate }}
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list>
    <ion-item>
      <ion-button class="add-button" (click)="addNewCategory()">
        <ion-icon aria-hidden="true" name="add" slot="end"></ion-icon>
        <ion-label>{{ 'settings.category.addNew' | translate }}</ion-label>
      </ion-button>
    </ion-item>

    <ion-reorder-group [disabled]="false">
    <!--                       (ionItemReorder)="handleReorder($any($event))-->
    @for (category of this.categories; track category) {
<ion-item>
      <ion-reorder slot="start"></ion-reorder>
      <ion-label>{{ category.name }}</ion-label>
      <ion-icon aria-hidden="true" name="pencil" slot="end" class="edit-button"
                (click)="editCategory(category.id)"></ion-icon>
          @if (this.categories.length > 1) {
            <ion-icon aria-hidden="true" name="trash" slot="end"
            (click)="deleteCategory(category.id)" class="delete-button"></ion-icon>
          }
        </ion-item>
      }
    </ion-reorder-group>
  </ion-list>
</ion-content>
