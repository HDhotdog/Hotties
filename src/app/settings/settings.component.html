<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button class="menu-button" (click)="openMainMenu()">
        <ion-icon name="menu"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>
      Settings
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="settings-container">
    <ion-list class="settings-list">
      <ion-item (click)="openLabelSetting()">
        <ion-icon aria-hidden="true" name="leaf" slot="start"></ion-icon>
        <ion-label>Manage labels</ion-label>
      </ion-item>
      <ion-item (click)="openCategorySetting()">
        <ion-icon aria-hidden="true" name="list" slot="start"></ion-icon>
        <ion-label>Manage categories</ion-label>
      </ion-item>
      <ion-item>
        <ion-icon aria-hidden="true" name="alert" slot="start"></ion-icon>
        <ion-label>Importance levels</ion-label>
      </ion-item>
      <ion-item>
        <ion-icon aria-hidden="true" name="color-palette" slot="start"></ion-icon>
        <ion-label>Customize colors</ion-label>
      </ion-item>
      <ion-item>
        <ion-icon aria-hidden="true" name="pizza" slot="start"></ion-icon>
        <ion-label>Manage suggestions</ion-label>
      </ion-item>
      <ion-item (click)="openCacheSetting()">
        <ion-icon aria-hidden="false" name="trash" slot="start"></ion-icon>
        <ion-label>Clear cache</ion-label>
      </ion-item>
      <ion-item (click)="openInfoSetting()">
        <ion-icon aria-hidden="false" name="information-circle-outline" slot="start"></ion-icon>
        <ion-label>About</ion-label>
      </ion-item>
    </ion-list>
  </div>
</ion-content>
