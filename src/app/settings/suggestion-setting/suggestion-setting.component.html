<ion-header [translucent]="true">
  <ion-toolbar class="toolbar">
    <ion-buttons slot="start">
      <ion-button class="back-button" (click)="navigateBack()">
        <ion-icon name="arrow-back"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>
      Manage suggestions
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list>
    @for (suggestion of this.suggestions; track suggestion; let i = $index) {
      <ion-item>
        <ion-label>{{ suggestion }}</ion-label>
        <ion-icon (click)="removeSuggestion(i)" aria-hidden="true" name="trash" slot="end"></ion-icon>
      </ion-item>
    }

  </ion-list>
</ion-content>
