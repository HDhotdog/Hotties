<div class="item-autocomplete">
  <ion-input
    [class]="inputClass"
    [placeholder]="placeholder"
    [ngModel]="value"
    (ngModelChange)="onInput($event)"
    (keyup.enter)="onEnter()"
    (ionFocus)="onFocus()"
    (ionBlur)="onBlur()"
  ></ion-input>
  @if (showSuggestions) {
    <ion-list class="suggestion-list" [class.suggestion-list-up]="openUpward">
      @for (item of suggestions; track item.id) {
        <ion-item button (click)="selectSuggestion(item)">
          <ion-label>{{ item.name }}</ion-label>
        </ion-item>
      }
    </ion-list>
  }
</div>
