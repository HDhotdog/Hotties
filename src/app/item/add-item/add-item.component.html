<ion-header [translucent]="true">
  <ion-toolbar class="toolbar">
    <ion-buttons slot="start">
      <ion-button (click)="navigateBack()" [attr.aria-label]="i18n.t('ui.previous')">
        <ion-icon name="arrow-back"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>{{ i18n.t('ui.item') }}</ion-title>
    <ion-buttons slot="end">
      <ion-button class="save-status-button" (click)="navigateBack()" [ngClass]="{
        'save-status-saved': this.saveStatus === 'saved',
        'save-status-unsaved': this.saveStatus === 'unsaved',
        'save-status-pulse': this.savePulse
      }" [attr.aria-label]="i18n.t('ui.save')">
        <ion-icon name="save"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="container">
    <ion-input class="name-input" [(ngModel)]="this.name" [placeholder]="i18n.t('ui.itemName')" [attr.aria-label]="i18n.t('ui.itemName')"></ion-input>

    <div class="card package-card">
      <div class="card-section">
        <span class="subtle-label">{{ i18n.t('ui.packageAmount') }}</span>
        <input appLocalizedNumber class="amount-input" [(ngModel)]="this.amount" type="number" min="0" [attr.aria-label]="i18n.t('ui.packageAmount')">
      </div>
      <div class="card-section align-end">
        <span class="subtle-label">{{ i18n.t('ui.unit') }}</span>
        <ion-select [(ngModel)]="this.unit" interface="popover" class="unit-select" [cancelText]="i18n.t('ui.cancel')" [okText]="i18n.t('ui.confirm')" [attr.aria-label]="i18n.t('ui.unit')">
          @for (unit of this.amountUnits; track unit) {
            <ion-select-option [value]="unit">{{ i18n.unit(unit) }}</ion-select-option>
          }
        </ion-select>
      </div>
    </div>

    <div class="card price-card">
      <div class="card-section">
        <span class="subtle-label">{{ i18n.t('ui.price') }}</span>
        <input appLocalizedNumber class="price-input" [(ngModel)]="this.price" type="number" min="0" step="0.01" [attr.aria-label]="i18n.t('ui.price')" [placeholder]="i18n.number(0, 2)">
      </div>
    </div>

    <div class="card type-card">
      <div class="card-section">
        <span class="subtle-label">{{ i18n.t('ui.type') }}</span>
        <div class="type-buttons">
          @for (itemType of this.itemTypes; track itemType) {
            <button type="button" [attr.aria-label]="i18n.t('itemTypes.' + itemType)" [attr.aria-pressed]="this.type === itemType"
              class="type-circle"
              [ngStyle]="getTypeColor(itemType)"
              [ngClass]="{'type-circle-selected': this.type === itemType}"
              (click)="setType(itemType)">
            </button>
          }
        </div>
      </div>
    </div>
  </div>
</ion-content>
