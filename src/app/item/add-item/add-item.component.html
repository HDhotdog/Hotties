<ion-header [translucent]="true">
  <ion-toolbar class="toolbar">
    <ion-buttons slot="start">
      <ion-button (click)="navigateBack()">
        <ion-icon name="arrow-back"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>Item</ion-title>
    <ion-buttons slot="end">
      <ion-button class="save-status-button" (click)="navigateBack()" [ngClass]="{
        'save-status-saved': this.saveStatus === 'saved',
        'save-status-unsaved': this.saveStatus === 'unsaved',
        'save-status-pulse': this.savePulse
      }">
        <ion-icon name="save"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="container">
    <ion-input class="name-input" [(ngModel)]="this.name" placeholder="Item name"></ion-input>

    <div class="card package-card">
      <div class="card-section">
        <span class="subtle-label">Package amount</span>
        <ion-input class="amount-input" [(ngModel)]="this.amount" type="number" min="0"></ion-input>
      </div>
      <div class="card-section align-end">
        <span class="subtle-label">Unit</span>
        <ion-select [(ngModel)]="this.unit" interface="popover" class="unit-select">
          @for (unit of this.amountUnits; track unit) {
            <ion-select-option [value]="unit">{{ unit }}</ion-select-option>
          }
        </ion-select>
      </div>
    </div>

    <div class="card price-card">
      <div class="card-section">
        <span class="subtle-label">Price</span>
        <ion-input class="price-input" [(ngModel)]="this.price" type="number" min="0" step="0.01"
                   placeholder="0.00"></ion-input>
      </div>
    </div>

    <div class="card type-card">
      <div class="card-section">
        <span class="subtle-label">Type</span>
        <div class="type-buttons">
          @for (itemType of this.itemTypes; track itemType) {
            <div
              class="type-circle"
              [ngStyle]="getTypeColor(itemType)"
              [ngClass]="{'type-circle-selected': this.type === itemType}"
              (click)="setType(itemType)">
            </div>
          }
        </div>
      </div>
    </div>
  </div>
</ion-content>
