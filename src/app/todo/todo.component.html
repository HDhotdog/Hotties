<ion-header [translucent]="true">
  <ion-toolbar class="toolbar" *ngIf="!this.isLoading">
    <ion-buttons slot="start">
      <ion-button (click)="toggleColorBar()">
        <ion-icon name="{{this.showColorBar ? 'eye' : 'eye-off'}}"></ion-icon>
      </ion-button>
    </ion-buttons>

    <ion-grid>
      <ion-row>
        <ion-select [(ngModel)]="categoryInputField" (ionChange)="changeCategory()">
          <div slot="label"></div>
          <ion-select-option *ngFor="let category of this.categoryService.categories">{{category.name}}</ion-select-option>
        </ion-select>
      </ion-row>
    </ion-grid>

    <ion-buttons slot="end">
      <ion-button class="back-button" (click)="changeSort()">
        <ion-icon name="{{this.sortIncreasing ? 'arrow-up' : 'arrow-down'}}"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="container-elements">
    <div class="upper-container" *ngIf="!this.isLoading">
      <div *ngFor="let todo of this.selectedCategory.elements" 
           class="todo-wrapper">
        <div class="todo" 
             [ngStyle]="getTodoBackgroundColor(todo.importance)"
             (ionSwipe)="markAsDone(todo)"
             #todoItem>
          {{todo.task}}
        </div>
      </div>
    </div>

    <div class="input-container">
      <div class="color-buttons" *ngIf="this.showColorBar">
        <div 
        *ngFor="let level of this.importanceLevels" 
        class="color-circle" 
        [ngStyle]="getCircleColorBackground(level)" 
        [ngClass]="{'circle-border': isCurrentLevel(level)}"
        (click)="setCurrentImportanceLevel(level)">
        </div>
      </div>
      <div class="lower-input-fields">
        <ion-button class="delete-button" color="danger" shape="round" (click)="clearTodos()">
          <ion-icon slot="icon-only" name="trash"></ion-icon>
        </ion-button>
        <ion-input placeholder="{{getCurrentSuggestion}}" [(ngModel)]="inputField"
          (keyup.enter)="addTodo(inputField)"></ion-input>
        <ion-button class="add-button" color="primary" shape="round" (click)="addTodo(inputField)">
          <ion-icon slot="icon-only" name="add"></ion-icon>
        </ion-button>
      </div>
    </div>
  </div>
</ion-content>
