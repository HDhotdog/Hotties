<!-- Main Menu -->
<ion-menu menuId="main-menu" contentId="main-content">
  <ion-header>
    <ion-toolbar>
      <ion-title>Hotties</ion-title>
    </ion-toolbar>
  </ion-header>
  <ion-content>
    <ion-list>
      <ion-item button routerLink="/tabs/todo" routerDirection="root" (click)="closeMenu()">
        <ion-icon slot="start" name="cart"></ion-icon>
        <ion-label>ToDo's</ion-label>
      </ion-item>

      <ion-item button routerLink="/tabs/recipe" routerDirection="root" (click)="closeMenu()">
        <ion-icon slot="start" name="pizza"></ion-icon>
        <ion-label>Recipes</ion-label>
      </ion-item>

      <ion-item button routerLink="/tabs/settings" routerDirection="root" (click)="closeMenu()">
        <ion-icon slot="start" name="settings"></ion-icon>
        <ion-label>Settings</ion-label>
      </ion-item>
    </ion-list>
  </ion-content>
</ion-menu>

<!-- Main Content -->
<div class="ion-page" id="main-content">
  <ion-header class="toolbar">
    <ion-toolbar>
      <ion-buttons slot="start">
        <ion-menu-button menu="main-menu"></ion-menu-button>
      </ion-buttons>
      <ion-title>{{getTitle()}}</ion-title>
      <ion-buttons slot="end">
        <ion-button *ngIf="isRecipeRoute()" class="add-button" (click)="addRecipe()">
          <ion-icon name="add"></ion-icon>
        </ion-button>
        <div *ngIf="!isRecipeRoute()" class="menu-spacer"></div>
      </ion-buttons>
    </ion-toolbar>
  </ion-header>

  <ion-content>
    <ion-router-outlet></ion-router-outlet>
  </ion-content>
</div>
