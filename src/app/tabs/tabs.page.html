<!-- Main Menu -->
<ion-menu menuId="main-menu" contentId="main-content" swipeGesture="true" maxEdgeStart="400">
  <ion-header>
    <ion-toolbar>
      <ion-title>Hotties</ion-title>
    </ion-toolbar>
  </ion-header>
  <ion-content>
    <ion-list>
      <ion-item button routerLink="/tabs/todo" routerDirection="root" (click)="closeMenu()">
        <ion-icon slot="start" aria-hidden="true" name="cart-outline"></ion-icon>
        <ion-label>ToDo's</ion-label>
      </ion-item>

      <ion-item button routerLink="/tabs/recipe" routerDirection="root" (click)="closeMenu()">
        <ion-icon slot="start" aria-hidden="true" name="pizza-outline"></ion-icon>
        <ion-label>Recipes</ion-label>
      </ion-item>

      <ion-item button routerLink="/tabs/fridge" routerDirection="root" (click)="closeMenu()">
        <ion-icon slot="start" aria-hidden="true" name="snow-outline"></ion-icon>
        <ion-label>Fridge</ion-label>
      </ion-item>

      <ion-item button routerLink="/tabs/settings" routerDirection="root" (click)="closeMenu()">
        <ion-icon slot="start" aria-hidden="true" name="settings-outline"></ion-icon>
        <ion-label>Settings</ion-label>
      </ion-item>
    </ion-list>
  </ion-content>
</ion-menu>

<!-- Main Content -->
<div class="ion-page" id="main-content">
  <ion-content>
    <ion-router-outlet></ion-router-outlet>
  </ion-content>
</div>
