<!-- Main Menu -->
<ion-menu menuId="main-menu" contentId="main-content" swipe-gesture="true" max-edge-start="400">
  <ion-header>
    <ion-toolbar>
      <ion-title class="menu-title">
        <span class="menu-brand">
          <img class="menu-logo" src="assets/icon/favicon.png" alt="" aria-hidden="true">
          Hotties
        </span>
      </ion-title>
      <ion-buttons slot="end">
        <ion-button class="menu-close-button" [attr.aria-label]="i18n.t('ui.closeMenu')" (click)="closeMenu()">
          <ion-icon slot="icon-only" aria-hidden="true" name="close-outline"></ion-icon>
        </ion-button>
      </ion-buttons>
    </ion-toolbar>
  </ion-header>
  <ion-content>
    <ion-list>
      <ion-item button lines="full" routerLink="/tabs/shopping" routerDirection="root" routerLinkActive="menu-item-active" ariaCurrentWhenActive="location" (click)="closeMenu()">
        <ion-icon slot="start" aria-hidden="true" name="cart-outline"></ion-icon>
        <ion-label>{{ i18n.t('ui.shopping') }}</ion-label>
      </ion-item>

      <ion-item button lines="full" routerLink="/tabs/recipe" routerDirection="root" routerLinkActive="menu-item-active" ariaCurrentWhenActive="location" (click)="closeMenu()">
        <ion-icon slot="start" aria-hidden="true" name="pizza-outline"></ion-icon>
        <ion-label>{{ i18n.t('ui.recipes') }}</ion-label>
      </ion-item>

      <ion-item button lines="full" routerLink="/tabs/fridge" routerDirection="root" routerLinkActive="menu-item-active" ariaCurrentWhenActive="location" (click)="closeMenu()">
        <ion-icon slot="start" aria-hidden="true" name="snow-outline"></ion-icon>
        <ion-label>{{ i18n.t('ui.fridge') }}</ion-label>
      </ion-item>

      <ion-item button lines="full" routerLink="/tabs/items" routerDirection="root" routerLinkActive="menu-item-active" ariaCurrentWhenActive="location" (click)="closeMenu()">
        <ion-icon slot="start" aria-hidden="true" name="pricetags-outline"></ion-icon>
        <ion-label>{{ i18n.t('ui.catalog') }}</ion-label>
      </ion-item>

      <ion-item button lines="full" routerLink="/tabs/settings" routerDirection="root" routerLinkActive="menu-item-active" ariaCurrentWhenActive="location" (click)="closeMenu()">
        <ion-icon slot="start" aria-hidden="true" name="settings-outline"></ion-icon>
        <ion-label>{{ i18n.t('ui.settings') }}</ion-label>
      </ion-item>
    </ion-list>
  </ion-content>
</ion-menu>

<!-- Main Content -->
<div class="ion-page" id="main-content">
  <ion-content>
    <ion-router-outlet></ion-router-outlet>
  </ion-content>
</div>
