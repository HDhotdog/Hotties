<ion-menu contentId="filter-menu">
  <ion-header>
    <ion-toolbar>
      <ion-title>Select filters</ion-title>
    </ion-toolbar>
  </ion-header>
<ion-content>
  <div class="filter-container">
    <div *ngFor="let group of labelService.labelGroups" class="label-group">
      <div class="group-name">{{ group.name }}</div>
      <ion-checkbox *ngFor="let label of group.labels" labelPlacement="start" (ionChange)="changeFilter($event, label)">{{label.name}}</ion-checkbox>
    </div>
  </div>
</ion-content>
</ion-menu>

<div id="filter-menu">
  <ion-content class="content-wrapper">
    <ion-searchbar [(ngModel)]="search"></ion-searchbar>
    <div class="recipes-list-container">
      <div class="recipe-preview-container" *ngFor="let recipe of this.results" (click)="openRecipe(recipe)">
        <div class="recipe-preview-title">
          <p>{{recipe.name}}</p>
          <p>{{this.parseDate(recipe)}}</p>
        </div>
        <div class="recipe-preview-image">
          <ion-img [src]="recipe.imgSrc"></ion-img>
        </div>
        <div class="recipe-preview-labels">
          <div class="recipe-preview-label" *ngFor="let label of recipe.labels">{{label.name}}</div>
        </div>
      </div>
    </div>
  </ion-content>
</div>
