<ion-menu contentId="filter-menu">
  <ion-header>
    <ion-toolbar>
      <ion-title>Select filters</ion-title>
    </ion-toolbar>
  </ion-header>
<ion-content>
  <div class="filter-container">
    <ion-checkbox *ngFor="let label of labels" labelPlacement="end">{{label.name}}</ion-checkbox>
  </div>
</ion-content>
</ion-menu>

<div id="filter-menu">
  <ion-header [translucent]="true">
    <ion-toolbar class="toolbar">

      <ion-buttons slot="start">
        <ion-menu-button></ion-menu-button>
      </ion-buttons>

      <ion-title>
        Recipes
      </ion-title>

      <ion-buttons slot="end">
        <ion-button class="add-button" (click)="newRecipe()">
          <ion-icon name="add"></ion-icon>
        </ion-button>
      </ion-buttons>

    </ion-toolbar>
  </ion-header>

  <ion-content class="content-wrapper">
    <ion-searchbar [(ngModel)]="search"></ion-searchbar>
    <div class="recipes-list-container">
      <div class="recipe-preview-container" *ngFor="let recipe of this.results" (click)="openRecipe(recipe)">
        <div class="recipe-preview-title">
          <p>{{recipe.name}}</p>
          <p>{{this.parseDate(recipe)}}</p>
        </div>
        <div class="recipe-preview-image">
          <ion-img src="https://www.zauberdergewuerze.de/magazin/wp-content/uploads/2023/03/05_oregano_istock-1174701047.jpg"></ion-img>
        </div>
        <div class="recipe-preview-labels">
          <div class="recipe-preview-label" *ngFor="let label of recipe.labels">{{label.name}}</div>
        </div>

      </div>
    </div>
  </ion-content>
</div>
