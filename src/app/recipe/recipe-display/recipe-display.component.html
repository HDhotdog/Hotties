<ion-header [translucent]="true">
  <ion-toolbar class="toolbar">
    <ion-buttons slot="start">
      <ion-button (click)="navigateBack()">
        <ion-icon name="arrow-back"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>
      Recipe
    </ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="deleteRecipe()">
        <ion-icon name="trash"></ion-icon>
      </ion-button>
      <ion-button (click)="editRecipe()">
        <ion-icon name="pencil"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="recipe-wrapper" *ngIf="!isLoading">
    <div class="recipe-header">
      <div class="title-container">
        <span class="emoji-display" *ngIf="recipe.emoji">{{ recipe.emoji }}</span>
        <h2>{{recipe.name}}</h2>
      </div>
      <h3>{{this.parseDate()}}</h3>
    </div>

    <ion-img
      src={{recipe.imgSrc}}></ion-img>

    <div class="ingredients">
      <p class="ingredients-title">Ingredients</p>
      <ul class="ingredients-items">
        <li *ngFor="let item of recipe?.ingredients">
          {{item.name}}
        </li>
      </ul>
      <div class="export-items">
        <p>Add ingredients to shopping list</p>
        <ion-button color="success" (click)="exportIngredients()">
          <ion-icon name="arrow-redo"></ion-icon>
        </ion-button>
      </div>
    </div>

    <div class="recipe-description">
      <p class="recipe-descirption-title">Instructions</p>
      <p class="recipe-description-content">{{recipe.description}}</p>
    </div>

    <div class="recipe-labels">
      <p class="recipe-label" *ngFor="let recipeLabel of recipe?.labels">
        {{recipeLabel.name}}
      </p>
    </div>
  </div>

  <ion-select #selectionList [(ngModel)]="selectedCategoryId" (ionChange)="ok()" class="selection-list">
    <ion-select-option *ngFor="let category of categories" [value]="category.id">{{category.name}}</ion-select-option>
  </ion-select>

</ion-content>
