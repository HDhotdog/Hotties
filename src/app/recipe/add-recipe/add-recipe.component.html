<ion-header [translucent]="true">
  <ion-toolbar class="toolbar">
    <ion-buttons slot="start">
      <ion-button (click)="navigateBack()">
        <ion-icon name="arrow-back"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>
      Edit recipe
    </ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="saveCategory()" [ngClass]="{'save-button-active': this.inputChanged()}"
        [disabled]="!this.inputChanged()">
        <ion-icon name="save"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="container">
    <ion-grid>
      <ion-row id="data-row">
        <ion-input [(ngModel)]="name" placeholder="Enter recipe name"></ion-input>
      </ion-row>
      <ion-row class="img-input">
        <ion-img id="recipe-image" src="{{this.imgSrc}}"></ion-img>
        <div class="custom-file-upload" *ngIf="!this.imageSelected;else delete_button">
          <div>
            {{"Upload image"}}
          </div>
          <ion-fab-button size="small" color="primary" class="upload-btn" (click)="uploadFile()">
            <ion-icon name="attach"></ion-icon>
          </ion-fab-button>
        </div>
        <ng-template #delete_button class="custom-file-upload">
          <ion-fab-button size="small" color="danger" class="upload-btn" (click)="deleteImage()">
            <ion-icon name="trash"></ion-icon>
          </ion-fab-button>
        </ng-template>
      </ion-row>
      <ion-row class="textarea-input">
        <ion-textarea [(ngModel)]="description" placeholder="Enter description"></ion-textarea>
      </ion-row>
      <ion-row class="time-input">

        <div class="time-input-section">
          <ion-label>Hours: </ion-label>
          <ion-input [(ngModel)]="hours" type="number" min="0" value="0"></ion-input>
        </div>
        <div class="time-input-section">
          <ion-label>Minutes: </ion-label>
          <ion-input [(ngModel)]="minutes" type="number" min="0" max="59" value="0"></ion-input>
        </div>
      </ion-row>
      <ion-row class="ingredient-section">
        <div class="ingredient-input">
          <ion-input placeholder="Enter ingredient" [(ngModel)]="ingredient" (keyup.enter)="addIngredient()"></ion-input>
          <ion-button shape="round" (click)="addIngredient()">
            <ion-icon name="add"></ion-icon>
          </ion-button>
        </div>
        <hr>
          <div *ngFor="let ingredient of this.ingredients" class="ingredient">
            <ion-label>{{ingredient.name}}</ion-label>
            <ion-button (click)="removeIngredient(ingredient)" color="danger" shape="round">
              <ion-icon name="trash"></ion-icon>
            </ion-button>
          </div>
      </ion-row>
      <ion-row class="label-row">
        <ion-select [(ngModel)]="stringLabels" (ngModelChange)="this.handleLabelChange()" class="label-selector" placeholder="Choose labels" [multiple]="true">
          <ion-select-option *ngFor="let label of this.availableLabels" value="{{label.name}}">{{label.name}}</ion-select-option>
        </ion-select>
      </ion-row>
    </ion-grid>
  </div>
</ion-content>
